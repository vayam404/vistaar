<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Vistaar · विस्तार</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Voice-first business manager for artisans and weavers. One voice note becomes a priced, authenticated listing on ONDC, Indiahandmade, GeM and WhatsApp.">
<meta name="theme-color" content="#FAF7F1">

<!-- Fonts load without blocking first paint. If the request never arrives the
     system stack below takes over and nothing about the layout changes. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"></noscript>

<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="components.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322376B'/%3E%3Cg stroke='%23E9C46A' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M7 11h18M7 16h18M7 21h18'/%3E%3C/g%3E%3Cpath d='M11 6v20M21 6v20' stroke='%23fff' stroke-width='1.6' opacity='.55'/%3E%3C/svg%3E">
</head>
<body>

<div class="stage">
  <!-- the device ------------------------------------------------------- -->
  <div class="device">
    <div class="screen" id="screen">
      <div class="notch" aria-hidden="true"></div>
      <div class="statusbar" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="sb-r">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 17h3v4H2zM7 13h3v8H7zM12 9h3v12h-3zM17 4h3v17h-3z"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12.5a10 10 0 0 1 14 0M8 16a5.5 5.5 0 0 1 8 0M12 19.5h.01"/></svg>
          <svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="8" width="18" height="9" rx="2.6"/><rect x="3.6" y="9.6" width="13" height="5.8" rx="1.4" fill="currentColor" stroke="none"/><path d="M22 11.5v3" stroke-linecap="round"/></svg>
        </span>
      </div>

      <!-- app chrome, painted by app.js -->
      <div id="chrome"></div>
      <main class="view" id="view" tabindex="-1"></main>
      <nav class="nav" id="nav" hidden></nav>

      <div class="homebar" aria-hidden="true"></div>
    </div>
  </div>

  <!-- x-ray rail: what the phone is doing, for anyone who wants the proof -->
  <aside class="rail" id="rail" hidden>
    <div class="rail-h">
      <span class="lg" id="railIcon"></span>
      <span>
        <b>Under the hood</b>
        <small id="railStatus">live state · not a mock-up</small>
      </span>
    </div>
    <div class="railtabs" id="railTabs" role="tablist"></div>
    <div class="railbody" id="railBody"></div>
    <p class="railnote" id="railNote"></p>
  </aside>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
